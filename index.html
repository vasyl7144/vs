<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Sound Button</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1e1e1e,#3b3b3b);
}

#btn{
    width:250px;
    height:250px;
    border:none;
    border-radius:30px;
    background:url("photo.jpg") center/cover;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    cursor:pointer;
    transition:0.15s;
}

#btn:hover{
    transform:scale(1.05);
}

#btn:active{
    transform:scale(0.9);
    box-shadow:0 0 40px rgba(255,255,255,.8);
}
</style>

</head>
<body>

<button id="btn"></button>

<audio id="sound" src="sound.mp3"></audio>

<script>
const btn = document.getElementById("btn");
const sound = document.getElementById("sound");

btn.onclick = () => {
    sound.currentTime = 0;
    sound.play();
};
</script>

</body>
</html>
